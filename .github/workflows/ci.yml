name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Enforce API package coverage
        run: |
          go test ./api -coverprofile=api.cover
          go tool cover -func=api.cover | tee api-coverage.txt
          awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 80) exit 1; found = 1 } END { if (!found) exit 1 }' api-coverage.txt
          go test ./api/cmd/server -coverprofile=server.cover
          go tool cover -func=server.cover | tee server-coverage.txt
          awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 80) exit 1; found = 1 } END { if (!found) exit 1 }' server-coverage.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run build-storybook
        working-directory: web
      - run: npm run test:bdd:validate
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:bdd
        working-directory: web

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
